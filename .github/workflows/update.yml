name: DataHot 定时更新

on:
  schedule:
    # UTC 0/6/12/18 点的第 17 分 → 北京时间 08:17 / 14:17 / 20:17 / 02:17
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 密钥泄露扫描（拦截含 API Key 的提交）
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --verbose .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 采集 → AI 加工 → 生成静态站
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: "https://api.deepseek.com"
          LLM_MODEL: "deepseek-v4-flash"
          MAX_LLM_TOKENS_PER_RUN: ${{ vars.MAX_LLM_TOKENS_PER_RUN || '160000' }}
          MAX_LLM_TOKENS_PER_DAY: ${{ vars.MAX_LLM_TOKENS_PER_DAY || '500000' }}
          MAX_COMPILE_EVENTS_PER_RUN: ${{ vars.MAX_COMPILE_EVENTS_PER_RUN || '8' }}
          CANDIDATE_CACHE_ENABLED: ${{ vars.CANDIDATE_CACHE_ENABLED || 'true' }}
          CANDIDATE_CACHE_TTL_DAYS: ${{ vars.CANDIDATE_CACHE_TTL_DAYS || '21' }}
          CANDIDATE_CACHE_ERROR_TTL_HOURS: ${{ vars.CANDIDATE_CACHE_ERROR_TTL_HOURS || '6' }}
          PIPELINE_ORDER: ${{ vars.PIPELINE_ORDER || 'event_first' }}
          MAX_DEEP_EVENTS_PER_RUN: ${{ vars.MAX_DEEP_EVENTS_PER_RUN || '2' }}
          DEEP_IMPORTANCE_THRESHOLD: ${{ vars.DEEP_IMPORTANCE_THRESHOLD || '80' }}
          CLUSTER_CACHE_TTL_DAYS: ${{ vars.CLUSTER_CACHE_TTL_DAYS || '14' }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          python3 pipeline/run_update.py
          python3 pipeline/build_site.py

      - name: 数据回写仓库（跨次累积去重）
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 定时更新数据 [skip ci]"
          file_pattern: "site/data/**"

      - name: 发布到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
