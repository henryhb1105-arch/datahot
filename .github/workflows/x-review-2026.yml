name: X 2026 one-off read-only review
on:
  push:
    branches: [codex/issue-204-x-review-2026]
    paths: [research/x-review-2026/queries.json]
permissions:
  contents: write
concurrency:
  group: datahot-x-review-2026
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify cost bounds without network
        run: python3 -m unittest discover -s research/x-review-2026 -p 'test_*.py' -v
      - name: Read with durable budget reservations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: python3 research/x-review-2026/collect_x.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x-review-2026
          path: research/x-review-2026/output/
          retention-days: 7
