name = "datahot-traffic"
main = "src/index.js"
compatibility_date = "2026-08-28"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "metrics.datahot.xiahongbin.com"
custom_domain = true

[[routes]]
pattern = "admin.datahot.xiahongbin.com"
custom_domain = true

[vars]
PUBLIC_SITE_ORIGIN = "https://datahot.xiahongbin.com"
PUBLIC_SITE_HOST = "datahot.xiahongbin.com"
METRICS_HOST = "metrics.datahot.xiahongbin.com"
ADMIN_HOST = "admin.datahot.xiahongbin.com"
SITE_ID = "datahot"
TARGET_DAILY_UV = "10"
TARGET_STREAK_DAYS = "14"
MEASUREMENT_START_DATE = "2026-08-29"
RETENTION_DAYS = "90"

[[d1_databases]]
binding = "DB"
database_name = "datahot-traffic"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["15 17 * * *"]
