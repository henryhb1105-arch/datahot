name: DataHot Bluesky 每日分发

on:
  schedule:
    # 北京时间 08:47 / 11:47 / 14:47 / 17:47 / 20:47，每次只发一条；
    # 每个时段 10 分钟后幂等补跑一次，GitHub 延迟或漏调度时仍有第二次机会。
    # 与 08:17 / 14:17 / 20:17 的内容更新错开，确保新详情页已经上线。
    - cron: "47 0 * * *"
    - cron: "57 0 * * *"
    - cron: "47 3 * * *"
    - cron: "57 3 * * *"
    - cron: "47 6 * * *"
    - cron: "57 6 * * *"
    - cron: "47 9 * * *"
    - cron: "57 9 * * *"
    - cron: "47 12 * * *"
    - cron: "57 12 * * *"
  # GitHub Schedule 没有准点 SLA。自然重试仍未落帖时，运营任务可通过 SSH
  # 推送唯一的 growth-YYYY-MM-DD-slotN tag 触发同一条 Actions 发布链路；
  # tag 与稳定 rkey 双重幂等，不把 Bluesky 凭据带到本地。
  push:
    tags:
      - "growth-*"
  workflow_dispatch:
    inputs:
      mode:
        description: "运营动作"
        required: true
        default: "publish"
        type: choice
        options:
          - "publish"
          - "sync_handle"
          - "sync_profile"
          - "audit"
      slot:
        description: "手动验证的分发位（0-4）"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"

permissions:
  contents: read

concurrency:
  group: datahot-bluesky-growth
  cancel-in-progress: false

jobs:
  publish:
    if: vars.GROWTH_BSKY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 解析本次分发位
        id: slot
        env:
          GROWTH_EVENT: ${{ github.event_name }}
          GROWTH_REF: ${{ github.ref_name }}
          GROWTH_SCHEDULE: ${{ github.event.schedule }}
          GROWTH_MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          skip=false
          case "$GROWTH_EVENT" in
            "schedule")
              case "$GROWTH_SCHEDULE" in
                "47 0 * * *"|"57 0 * * *") slot=0 ;;
                "47 3 * * *"|"57 3 * * *") slot=1 ;;
                "47 6 * * *"|"57 6 * * *") slot=2 ;;
                "47 9 * * *"|"57 9 * * *") slot=3 ;;
                "47 12 * * *"|"57 12 * * *") slot=4 ;;
                *) echo "未知分发计划：$GROWTH_SCHEDULE" >&2; exit 1 ;;
              esac
              ;;
            "workflow_dispatch") slot="$GROWTH_MANUAL_SLOT" ;;
            "push")
              if [[ "$GROWTH_REF" =~ ^growth-([0-9]{4}-[0-9]{2}-[0-9]{2})-slot([0-4])(-r1)?$ ]]; then
                trigger_date="${BASH_REMATCH[1]}"
                slot="${BASH_REMATCH[2]}"
              else
                echo "非法增长触发 tag：$GROWTH_REF" >&2
                exit 1
              fi
              today="$(TZ=Asia/Shanghai date +%F)"
              if [ "$trigger_date" != "$today" ]; then
                echo "跳过过期增长触发 tag：$GROWTH_REF（今天 $today）"
                skip=true
              fi
              ;;
            *) echo "未知触发事件：$GROWTH_EVENT" >&2; exit 1 ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: 执行运营动作
        if: steps.slot.outputs.skip != 'true'
        env:
          GROWTH_BSKY_ENABLED: ${{ vars.GROWTH_BSKY_ENABLED || 'false' }}
          GROWTH_MODE: ${{ inputs.mode || 'publish' }}
          GROWTH_SLOT: ${{ steps.slot.outputs.slot }}
          GROWTH_SCHEDULE: ${{ github.event.schedule }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          case "$GROWTH_MODE" in
            "sync_handle") python3 pipeline/growth_share.py --sync-handle ;;
            "sync_profile") python3 pipeline/growth_share.py --sync-profile ;;
            "audit") python3 pipeline/bluesky_audit.py ;;
            "publish")
              args=(--slot "$GROWTH_SLOT")
              if [ -n "$GROWTH_SCHEDULE" ]; then
                args+=(--scheduled-cron "$GROWTH_SCHEDULE")
              fi
              python3 pipeline/growth_share.py "${args[@]}"
              ;;
            *) echo "未知运营动作：$GROWTH_MODE" >&2; exit 1 ;;
          esac
