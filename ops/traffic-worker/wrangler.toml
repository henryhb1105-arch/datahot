name = "datahot-traffic"
main = "src/index.js"
compatibility_date = "2026-08-28"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "metrics.datahot.xiahongbin.com"
custom_domain = true

[[routes]]
pattern = "admin.datahot.xiahongbin.com"
custom_domain = true

[vars]
PUBLIC_SITE_ORIGIN = "https://datahot.xiahongbin.com"
PUBLIC_SITE_HOST = "datahot.xiahongbin.com"
METRICS_HOST = "metrics.datahot.xiahongbin.com"
ADMIN_HOST = "admin.datahot.xiahongbin.com"
SITE_ID = "datahot"
TARGET_DAILY_UV = "10"
TARGET_STREAK_DAYS = "14"
MEASUREMENT_START_DATE = "2026-09-01"
RETENTION_DAYS = "90"

[[d1_databases]]
binding = "DB"
database_name = "datahot-traffic"
database_id = "308949c8-5459-4cc5-82a4-0c13d7535eb3"
migrations_dir = "migrations"

[[ratelimits]]
name = "ADMIN_LOGIN_RATE_LIMITER"
namespace_id = "17001"

[ratelimits.simple]
limit = 5
period = 60

[triggers]
crons = ["15 17 * * *"]
