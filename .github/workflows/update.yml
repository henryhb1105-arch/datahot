name: DataHot 定时更新

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update.yml"
      - ".github/workflows/deploy.yml"
      - "pipeline/**"
      - "integrations/**"
      - "skills/**"
      - "ui-mockup/**"
      - "requirements.txt"
  schedule:
    # UTC 0/6/12/18 点的第 17 分 → 北京时间 08:17 / 14:17 / 20:17 / 02:17
    - cron: "17 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      backfill_event_ids:
        description: "可选：只重抓指定正文事件 ID，多个用逗号分隔"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: datahot-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 密钥泄露扫描（拦截含 API Key 的提交）
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz | tar xz gitleaks
          ./gitleaks git --verbose --redact .

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装图片安全处理依赖
        run: python3 -m pip install --require-hashes -r requirements.txt

      - name: 保存本轮主线数据基线
        run: |
          baseline="$RUNNER_TEMP/datahot-main-baseline"
          mkdir -p "$baseline"
          cp site/data/latest.json "$baseline/latest.json"
          jq -r '.events[].event_id | "e/\(.).html"' site/data/latest.json > "$baseline/details.txt"

      - name: 回归测试（Python + 浏览器事件客户端）
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/analytics.test.js tests/for-me.test.js tests/home.test.js tests/tts-player.test.js

      - name: 采集 → AI 加工 → 生成静态站
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: "https://api.deepseek.com"
          LLM_MODEL: "deepseek-v4-flash"
          MAX_LLM_TOKENS_PER_RUN: ${{ vars.MAX_LLM_TOKENS_PER_RUN || '160000' }}
          MAX_LLM_TOKENS_PER_DAY: ${{ vars.MAX_LLM_TOKENS_PER_DAY || '1000000' }}
          MAX_COMPILE_EVENTS_PER_RUN: ${{ vars.MAX_COMPILE_EVENTS_PER_RUN || '8' }}
          CANDIDATE_CACHE_ENABLED: ${{ vars.CANDIDATE_CACHE_ENABLED || 'true' }}
          CANDIDATE_CACHE_TTL_DAYS: ${{ vars.CANDIDATE_CACHE_TTL_DAYS || '21' }}
          CANDIDATE_CACHE_ERROR_TTL_HOURS: ${{ vars.CANDIDATE_CACHE_ERROR_TTL_HOURS || '6' }}
          PIPELINE_ORDER: ${{ vars.PIPELINE_ORDER || 'event_first' }}
          MAX_DEEP_EVENTS_PER_RUN: ${{ vars.MAX_DEEP_EVENTS_PER_RUN || '2' }}
          DEEP_IMPORTANCE_THRESHOLD: ${{ vars.DEEP_IMPORTANCE_THRESHOLD || '80' }}
          CLUSTER_CACHE_TTL_DAYS: ${{ vars.CLUSTER_CACHE_TTL_DAYS || '14' }}
          MEDIA_BLOCKS_ENABLED: ${{ vars.MEDIA_BLOCKS_ENABLED || 'true' }}
          MEDIA_MAX_BYTES: ${{ vars.MEDIA_MAX_BYTES || '5000000' }}
          MEDIA_MAX_PIXELS: ${{ vars.MEDIA_MAX_PIXELS || '24000000' }}
          MEDIA_MAX_PER_EVENT: ${{ vars.MEDIA_MAX_PER_EVENT || '12' }}
          MEDIA_CACHE_MAX_BYTES: ${{ vars.MEDIA_CACHE_MAX_BYTES || '250000000' }}
          MEDIA_CACHE_BACKFILL_EVENTS: ${{ vars.MEDIA_CACHE_BACKFILL_EVENTS || '48' }}
          CONTENT_TRANSLATION_BACKFILL_LIMIT: ${{ vars.CONTENT_TRANSLATION_BACKFILL_LIMIT || '6' }}
          CONTENT_METADATA_BACKFILL_LIMIT: ${{ vars.CONTENT_METADATA_BACKFILL_LIMIT || '3' }}
          CONTENT_BLOCKS_BACKFILL_DAYS: ${{ vars.CONTENT_BLOCKS_BACKFILL_DAYS || '30' }}
          CONTENT_BACKFILL_ATTEMPTS: ${{ vars.CONTENT_BACKFILL_ATTEMPTS || '12' }}
          CONTENT_BACKFILL_EVENT_IDS: ${{ inputs.backfill_event_ids || '' }}
          ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED || 'false' }}
          ANALYTICS_ENDPOINT: ${{ vars.ANALYTICS_ENDPOINT }}
          ANALYTICS_SITE_ID: ${{ vars.ANALYTICS_SITE_ID || 'datahot' }}
          ANALYTICS_ENV: "production"
          ANALYTICS_PRODUCTION_HOST: "datahot.xiahongbin.com"
          SITE_BASE_URL: "https://datahot.xiahongbin.com"
          WEEKLY_BRIEF_ENABLED: ${{ vars.WEEKLY_BRIEF_ENABLED || vars.DAILY_BRIEF_ENABLED || 'true' }}
          WEEKLY_BRIEF_FORCE: ${{ vars.WEEKLY_BRIEF_FORCE || vars.DAILY_BRIEF_FORCE || 'false' }}
          FEED_ENABLED: ${{ vars.FEED_ENABLED || 'true' }}
          LITE_HOME_ENABLED: ${{ vars.LITE_HOME_ENABLED || 'true' }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          python3 pipeline/run_update.py
          python3 pipeline/build_site.py
          python3 pipeline/check_links.py site

      - name: 周报 AI 生成状态（异常时告警，不阻塞资讯更新）
        continue-on-error: true
        run: python3 pipeline/check_weekly_brief.py site/data/weekly_brief.json --expect-ai

      - name: 主线数据回写前防缩水
        run: |
          baseline="$RUNNER_TEMP/datahot-main-baseline"
          python3 pipeline/release_guard.py \
            --baseline-latest "$baseline/latest.json" \
            --baseline-details "$baseline/details.txt" \
            --candidate-site site \
            --source-sha "${{ github.sha }}" \
            --run-id "update-${{ github.run_id }}" \
            --issue "automatic update" \
            --output "$RUNNER_TEMP/datahot-main-guard.json"

      - name: 数据回写仓库（跨次累积去重）
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: 定时更新数据 [skip ci]"
          file_pattern: "site/data/** site/media/**"

  publish:
    name: 请求统一 Pages 发布
    needs: update
    uses: ./.github/workflows/deploy.yml
    with:
      release_issue: ${{ github.event.head_commit.message || github.event_name }}
    secrets: inherit
