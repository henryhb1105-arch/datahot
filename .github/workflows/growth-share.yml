name: DataHot Bluesky 每日分发

on:
  schedule:
    # 北京时间 08:47 / 11:47 / 14:47 / 17:47 / 20:47，每次只发一条；
    # 每个时段 10 分钟后幂等补跑一次，GitHub 延迟或漏调度时仍有第二次机会。
    # 与 08:17 / 14:17 / 20:17 的内容更新错开，确保新详情页已经上线。
    - cron: "47 0 * * *"
    - cron: "57 0 * * *"
    - cron: "47 3 * * *"
    - cron: "57 3 * * *"
    - cron: "47 6 * * *"
    - cron: "57 6 * * *"
    - cron: "47 9 * * *"
    - cron: "57 9 * * *"
    - cron: "47 12 * * *"
    - cron: "57 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "运营动作"
        required: true
        default: "publish"
        type: choice
        options:
          - "publish"
          - "sync_profile"
      slot:
        description: "手动验证的分发位（0-4）"
        required: true
        default: "0"
        type: choice
        options:
          - "0"
          - "1"
          - "2"
          - "3"
          - "4"

permissions:
  contents: read

concurrency:
  group: datahot-bluesky-growth
  cancel-in-progress: false

jobs:
  publish:
    if: vars.GROWTH_BSKY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 解析本次分发位
        id: slot
        env:
          GROWTH_SCHEDULE: ${{ github.event.schedule }}
          GROWTH_MANUAL_SLOT: ${{ inputs.slot }}
        run: |
          case "$GROWTH_SCHEDULE" in
            "47 0 * * *"|"57 0 * * *") slot=0 ;;
            "47 3 * * *"|"57 3 * * *") slot=1 ;;
            "47 6 * * *"|"57 6 * * *") slot=2 ;;
            "47 9 * * *"|"57 9 * * *") slot=3 ;;
            "47 12 * * *"|"57 12 * * *") slot=4 ;;
            "") slot="$GROWTH_MANUAL_SLOT" ;;
            *) echo "未知分发计划：$GROWTH_SCHEDULE" >&2; exit 1 ;;
          esac
          echo "slot=$slot" >> "$GITHUB_OUTPUT"

      - name: 发布本时段精选
        env:
          GROWTH_BSKY_ENABLED: ${{ vars.GROWTH_BSKY_ENABLED || 'false' }}
          GROWTH_MODE: ${{ inputs.mode || 'publish' }}
          GROWTH_SLOT: ${{ steps.slot.outputs.slot }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: |
          if [ "$GROWTH_MODE" = "sync_profile" ]; then
            python3 pipeline/growth_share.py --sync-profile
          else
            python3 pipeline/growth_share.py --slot "$GROWTH_SLOT"
          fi
